name: Build Pre-Release
on:
  # Upstream also runs this on every push to main. This fork does not:
  #
  # 1. It cannot succeed here. The job signs with a release keystore fed
  #    from repo secrets, and this fork deliberately has none -- the
  #    personal signing key never leaves the developer's machine, because
  #    this fork is public and a CI-reachable key would let anyone forge
  #    "updates" to the app. See scripts/resign-fork-apk.sh in the outer
  #    vpn-leak-testing repo; CI APKs are re-signed locally instead.
  #    (The job also `cat`s signing.properties into the log, which is a
  #    second reason not to hand it a real key.)
  # 2. We would not want it to succeed. It moves the Prerelease-alpha tag
  #    and publishes a GitHub Release on a research fork.
  #
  # It failed on all three pushes to main between 2026-04 and 2026-08,
  # burning ~10 min of CI each time before dying at packageAlphaRelease.
  # Build Debug still runs on main and is the signal we actually use.
  #
  # workflow_dispatch is kept so the job can be run deliberately if this
  # fork ever gets its own signing secrets; it will fail until then.
  workflow_dispatch:

jobs:
  BuildPreRelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Signing properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          touch signing.properties
          echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
          echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
          echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties
            
          echo "cat signing.properties"
          cat signing.properties

      # Fleet-status feed (hourly per-node Gemini/YouTube verdicts). The
      # feed path is a shared secret, so it is injected at build time
      # instead of being committed. Without the secret the build simply
      # ships an empty URL and the feature stays dormant until one is
      # entered in Settings -> Network.
      - name: Fleet status properties
        env:
          FLEET_STATUS_URL: ${{ secrets.FLEET_STATUS_URL }}
        run: |
          if [ -n "$FLEET_STATUS_URL" ]; then
            echo "fleet.status.url=$FLEET_STATUS_URL" >> local.properties
            echo "fleet.status.url injected"
          else
            echo "FLEET_STATUS_URL secret is not set, building without a baked-in feed url"
          fi

      - name: Pre-release Build
        if: success()
        run: ./gradlew --no-daemon app:assembleAlphaRelease

      # Delete old Prerelease-alpha
      - uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: Prerelease-alpha
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true

      - name: Tag Repo
        uses: richardsimko/update-tag@v3
        with:
          tag_name: Prerelease-alpha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Alpha
        uses: softprops/action-gh-release@v3
        if: ${{  success() }}
        with:
          tag_name: Prerelease-alpha
          files: app/build/outputs/apk/alpha/release/*
          prerelease: true
          generate_release_notes: true

      - name: Release Changelog Builder
        uses: mikepenz/release-changelog-builder-action@v6
